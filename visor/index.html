<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor Carpincho</title>
<meta name="description" content="Visor 3D interactivo del robot de rescate Carpincho (UruBots): ensamble, despiece y catálogo de piezas.">
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1d2230; --muted: #626a7c; --line: #dde1e8;
    --accent: #e8730c; --accent-ink: #ffffff; --sel: #1f6feb; --canvas: #e9ecf1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141a; --panel: #181c24; --ink: #e7eaf0; --muted: #98a1b3; --line: #2a303c;
      --accent: #ff8a2a; --accent-ink: #1a1206; --sel: #58a6ff; --canvas: #0d1015;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141a; --panel: #181c24; --ink: #e7eaf0; --muted: #98a1b3; --line: #2a303c;
    --accent: #ff8a2a; --accent-ink: #1a1206; --sel: #58a6ff; --canvas: #0d1015;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 16px; }
  main { position: relative; background: var(--canvas); min-height: 0; }
  #view { position: absolute; inset: 0; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .stat b { display: block; font-size: 15px; }
  .stat span { color: var(--muted); font-size: 12px; }
  label.grp { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  input[type=search] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font: inherit; }
  ul.parts { list-style: none; margin: 8px 0 0; padding: 0; }
  ul.parts li { padding: 5px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; }
  ul.parts li:hover { background: var(--bg); }
  ul.parts li.on { outline: 2px solid var(--sel); }
  ul.parts code { color: var(--accent); font-size: 12px; min-width: 58px; }
  ul.parts .q { margin-left: auto; color: var(--muted); font-size: 12px; }
  .card { position: absolute; right: 16px; top: 16px; width: min(360px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.15); display: none; }
  .card.show { display: block; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .card dl { display: grid; grid-template-columns: 90px 1fr; gap: 3px 8px; margin: 0; font-size: 13px; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; }
  .card a { color: var(--sel); margin-right: 10px; }
  .hint { position: absolute; left: 16px; bottom: 12px; color: var(--muted); font-size: 12px; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    main { grid-row: 1; height: 55vh; }
    aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
  <aside>
    <h1>Carpincho · URB-R1</h1>
    <p class="sub">Robot de rescate de UruBots: ensamble y despiece interactivo</p>
    <div class="stats" id="stats"></div>

    <h2>Despiece</h2>
    <input type="range" id="explode" min="0" max="100" value="0" aria-label="Despiece">
    <h2>Vistas</h2>
    <div class="btns">
      <button data-view="iso" class="primary">Isométrica</button>
      <button data-view="front">Frente</button>
      <button data-view="side">Lateral</button>
      <button data-view="top">Planta</button>
      <button id="theme">Tema</button>
    </div>

    <h2>Subsistemas</h2>
    <div id="groups"></div>

    <h2>Piezas</h2>
    <input type="search" id="q" placeholder="Buscar código o nombre…">
    <ul class="parts" id="parts"></ul>
  </aside>
  <main>
    <div id="view"></div>
    <div class="loading" id="loading">Cargando modelo 3D…</div>
    <div class="card" id="card"></div>
    <div class="hint">Arrastrar: girar · Rueda: zoom · Clic derecho: mover · Clic en una pieza: ficha</div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
