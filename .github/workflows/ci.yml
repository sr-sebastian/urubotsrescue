name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Firmware (tests de PC + compilación ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests de protocolo y control (g++)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/carpincho_base/include \
            firmware/carpincho_base/test_host/test_protocol.cpp -o test_protocol
          ./test_protocol
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/carpincho_base/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PlatformIO
        run: |
          pip install platformio
          cd firmware/carpincho_base && pio run

  ros2:
    name: ROS 2 Jazzy (colcon build + test)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          apt-get update
          apt-get install -y python3-pytest python3-serial python3-opencv python3-numpy \
            ros-jazzy-xacro ros-jazzy-cv-bridge ros-jazzy-tf2-ros-py ros-jazzy-ament-cmake-pytest
      - name: Build y tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_cohesion+
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose

  cad:
    name: CAD (CadQuery build rápido)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build de piezas
        run: |
          pip install -r cad/requirements.txt
          python cad/build.py --fast
          python tools/gen_docs.py
      - name: Interferencias del ensamble y del brazo
        run: python tools/check_interferences.py
      - name: Los archivos generados están al día
        run: |
          git status --porcelain -- cad/out/parts.json cad/out/masa_cg.md docs/03-mecanica hardware/bom.md \
            ros2_ws/src/carpincho_description/urdf/carpincho_params.xacro
          echo "(si hay diferencias, correr cad/build.py y tools/gen_docs.py y commitear)"
