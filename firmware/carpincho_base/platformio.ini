; Firmware de la placa base del Carpincho (ESP32-S3-DevKitC-1 N8R8)
; Compilar:   pio run          Subir: pio run -t upload      Monitor: usar tools/base_monitor.py
; Tests de PC (sin placa): ver test_host/README.md

[env:esp32s3]
platform = espressif32@6.9.0          ; core Arduino 2.0.x (API ledcSetup/ledcAttachPin)
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
monitor_speed = 921600
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -Wall
lib_deps =
  madhephaestus/ESP32Encoder@^0.11.7
  adafruit/Adafruit BNO055@^1.6.3
  adafruit/Adafruit NeoPixel@^1.12.3
  robtillaart/INA226@^0.6.0
