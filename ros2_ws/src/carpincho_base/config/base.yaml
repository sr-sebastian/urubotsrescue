base_bridge:
  ros__parameters:
    port: /dev/carpincho_base          # symlink creado por la regla udev (ver bringup/udev)
    baud: 921600
    track_separation: 0.275            # 2 * Y_TRACK_C
    slip_factor: 1.6                   # CALIBRAR (docs/05-software/calibracion.md)
    max_speed: 0.7
    cmd_timeout: 0.5
    publish_tf: true                   # false si usás robot_localization/FAST-LIO para odom->base
    use_imu_yaw: true
    counts_per_m: 3780.1               # 7*4*27*1.5 / (pi*0.09549) -> CALIBRAR con 5 m medidos
    invert_left_encoder: false
    invert_right_encoder: true
    auto_enable: false                 # por seguridad: armar con el botón START del joystick
    kp: 0.8
    ki: 4.0
    kff: 1.333
    max_accel: 1.5
    flip_kp: 3.0
    flip_max_vel: 1.5
