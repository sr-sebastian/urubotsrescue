octomap_server:
  ros__parameters:
    frame_id: map
    base_frame_id: base_footprint
    resolution: 0.05
    sensor_model.max_range: 8.0
    pointcloud_min_z: 0.05            # altura (m, en map) desde la que algo es obstáculo
    pointcloud_max_z: 1.0
    occupancy_min_z: 0.05
    occupancy_max_z: 1.0
    filter_ground_plane: false
    latch: true
