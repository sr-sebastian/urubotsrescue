qr_front:
  ros__parameters: {max_rate: 10.0, upscale: 1.0}
qr_gripper:
  ros__parameters: {max_rate: 10.0, upscale: 1.5}    # QR chicos de las tareas de inspección
hazmat:
  ros__parameters:
    model_path: /home/carpincho/modelos/hazmat_yolo_n.engine   # TensorRT (o .pt)
    conf: 0.5
    imgsz: 640
    device: "0"
    max_rate: 8.0
motion:
  ros__parameters: {alpha: 0.05, threshold: 25, min_area_frac: 0.002, scale: 0.5}
thermal_viewer:
  ros__parameters:
    raw_scale: 0.015625        # 1/64 (InfiRay P2 Pro / Topdon TC001 en Y16)
    raw_offset: -273.15
    heat_threshold_c: 32.0
    upscale: 3
apriltag:
  ros__parameters:
    family: 41h12              # reglamento: AprilTags Standard41h12
    size: 0.10                 # m (medir en la competencia)
    max_hamming: 0
    detector: {threads: 2, decimate: 1.0, blur: 0.0, refine: true, sharpening: 0.25}
poi_manager:
  ros__parameters:
    map_frame: map
    robot_name: Carpincho
    min_hits: 3
    radius: 0.5
    fallback_range: 0.6
    depth_topic: /depth_cam/depth/image_raw        # con depth_registration: alineada al color
    camera_info_topic: /depth_cam/color/camera_info
mission_exporter:
  ros__parameters:
    team: UruBots
    country: Uruguay
    robot_name: Carpincho
    output_dir: ~/carpincho_mission
    front_offset: 0.26          # m de base_footprint al frente de las orugas
    voxel: 0.03
    cloud_topic: /Laser_map
    map_topic: /map
